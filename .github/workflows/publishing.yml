name: publishing

on:
  push:
    tags: '*'

jobs:
  app-config:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v1
      with:
        node-version: 22.x
        registry-url: https://registry.npmjs.org

    - run: npm install -g npm@latest
    - run: yarn install

    # Prereleases (e.g. 2.9.0-beta.4) publish under their identifier (beta), stable versions under latest
    - name: dist-tag
      run: |
        version=$(node -p "require('./app-config-main/package.json').version")
        if [[ "$version" == *-* ]]; then
          prerelease="${version#*-}"
          tag="${prerelease%%.*}"
        else
          tag=latest
        fi
        echo "Publishing $version with tag $tag"
        echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"

    - name: app-config-config
      working-directory: ./app-config-config
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-core
      working-directory: ./app-config-core
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-cypress
      working-directory: ./app-config-cypress
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-electron
      working-directory: ./app-config-electron
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-default-extensions
      working-directory: ./app-config-default-extensions
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-encryption
      working-directory: ./app-config-encryption
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-exec
      working-directory: ./app-config-exec
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-extension-utils
      working-directory: ./app-config-extension-utils
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-extensions
      working-directory: ./app-config-extensions
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-generate
      working-directory: ./app-config-generate
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-git
      working-directory: ./app-config-git
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-inject
      working-directory: ./app-config-inject
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-js
      working-directory: ./app-config-js
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-logging
      working-directory: ./app-config-logging
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-meta
      working-directory: ./app-config-meta
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-node
      working-directory: ./app-config-node
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-react-native
      working-directory: ./app-config-react-native
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-schema
      working-directory: ./app-config-schema
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-settings
      working-directory: ./app-config-settings
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-utils
      working-directory: ./app-config-utils
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-v1-compat
      working-directory: ./app-config-v1-compat
      run: npm stage publish --access public --tag "$NPM_DIST_TAG"
    - name: app-config-vault
